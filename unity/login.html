<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DejaView - Staff Login</title>
    <style>
        :root { --maroon: #a50012; --maroon-dark: #7d000d; --gold: #f6a829; --ink: #2b2b2b; --muted: #6b6b6b; }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--maroon);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 24px 5vw;
        }

        /* Full-screen BulSU background on desktop */
        .hero {
            position: fixed; inset: 0; z-index: 0;
            background: var(--maroon) url("images/bulsu-bg.jpg") no-repeat right center / cover;
        }

        .card {
            position: relative; z-index: 1;
            width: 100%; max-width: 380px;
            background: #fff;
            border-radius: 18px;
            border-top: 6px solid var(--gold);
            padding: 32px 30px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            text-align: center;
        }
        .seal { width: 84px; height: 84px; object-fit: contain; margin-bottom: 8px; }
        h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 2rem; color: var(--maroon); letter-spacing: .5px; }
        h2 { margin: 4px 0 2px; font-size: .95rem; font-weight: 600; color: var(--ink); }
        .sub { margin: 0 0 22px; font-size: .82rem; color: var(--muted); }

        form { text-align: left; }
        label { display: block; margin: 0 0 6px; font-size: .8rem; font-weight: 600; color: var(--ink); }
        .field { margin-bottom: 16px; }
        .field input {
            width: 100%; padding: 12px 14px; font-size: 1rem;
            border: 1.5px solid #d9d9d9; border-radius: 10px; background: #fafafa;
            outline: none; transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus { border-color: var(--maroon); box-shadow: 0 0 0 3px rgba(165, 0, 18, .15); background: #fff; }
        .pw { position: relative; }
        .pw input { padding-right: 64px; }
        .pw button {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            border: 0; background: none; color: var(--maroon); font-size: .8rem; font-weight: 600; cursor: pointer; padding: 6px;
        }

        .login-btn {
            width: 100%; padding: 13px; margin-top: 4px;
            border: 0; border-radius: 10px; cursor: pointer;
            background: var(--maroon); color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: .3px;
            transition: background .15s, transform .05s;
        }
        .login-btn:hover { background: var(--maroon-dark); }
        .login-btn:active { transform: scale(.98); }
        .login-btn:disabled { opacity: .7; cursor: wait; }

        #loginMessage { min-height: 1.3em; margin: 12px 0 0; text-align: center; font-size: .85rem; color: var(--maroon); }
        .foot { margin: 16px 0 0; text-align: center; font-size: .72rem; color: var(--muted); line-height: 1.4; }

        /* Tablets and phones: banner on top, form below */
        @media (max-width: 1000px) {
            body { display: block; padding: 0; background: #f4f1ee; }
            .hero { position: static; height: 210px; background-position: 70% center; }
            .card { margin: -40px auto 30px; width: calc(100% - 32px); }
        }
    #toasts{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
        .toast{background:#1f7a3a;color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .3s,transform .3s;cursor:pointer}
        .toast.err{background:#b3261e}.toast.warn{background:#b26a00}.toast.info{background:#2a5bd7}.toast.hide{opacity:0;transform:translateX(20px)}
    </style>
</head>
<body>
    <div class="hero" role="img" aria-label="Bulacan State University Sarmiento Campus, Department of Hospitality and Tourism Management"></div>

    <main class="card">
        <img class="seal" src="images/htm-logo.png" onerror="this.onerror=null;this.src='images/bulsu-seal.png'" alt="Department of Hospitality and Tourism Management logo">
        <h1>DejaView</h1>
        <h2>Instructor &amp; Admin Portal</h2>
        <p class="sub">For instructors and the administrator only. Students register and see their results in the DejaView VR app.</p>

        <form id="loginForm">
            <div class="field">
                <label for="email">Email or Employee ID</label>
                <input type="text" id="email" placeholder="Email or 10-digit Employee ID" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="pw">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" id="togglePw">Show</button>
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
            <p id="loginMessage"></p>
        </form>

        <p class="foot">Bulacan State University &middot; Sarmiento Campus<br>Department of Hospitality and Tourism Management</p>
    </main>

    <script type="module">
        import { auth, db, $ } from "./firebase.js";
        import { toast } from "./toast.js";
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
        import { getDoc, doc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

        // Send each person to their own page: admin or teacher
        async function route(user) {
            try {
                const has = async c => (await getDoc(doc(db, c, user.uid))).exists();
                if (await has("admins")) return location.replace("admin.html");
                if (await has("teachers")) return location.replace("index.html");
            } catch (err) { console.error(err); }
            await signOut(auth);
            $("loginMessage").textContent = "This website is for instructors and the administrator only.";
            toast("This website is for instructors and the administrator only. Students use the DejaView VR app.", "err");
            $("loginBtn").disabled = false;
        }
        onAuthStateChanged(auth, u => { if (u) route(u); });

        $("togglePw").addEventListener("click", () => {
            const show = $("password").type === "password";
            $("password").type = show ? "text" : "password";
            $("togglePw").textContent = show ? "Hide" : "Show";
        });

        $("loginForm").addEventListener("submit", async e => {
            e.preventDefault();
            let id = $("email").value.trim();
            if (!id || !$("password").value) { toast("Enter your email or Employee ID and your password.", "warn"); return; }
            if (!id.includes("@")) {                                          // an Employee ID
                id = id.replace(/\s+/g, "");
                if (!/^[0-9]{10}$/.test(id)) { toast("An Employee ID is exactly 10 digits. Or type your email.", "warn"); return; }
                id = id + "@staff.dejaview.app";
            }
            $("loginMessage").textContent = "Logging in...";
            $("loginBtn").disabled = true;
            try {
                await signInWithEmailAndPassword(auth, id, $("password").value);
            } catch (err) {
                console.error(err);
                const c = err.code || "";
                const msg = c.includes("network") ? "No internet connection. Please try again."
                    : c.includes("too-many") ? "Too many attempts. Please wait a few minutes and try again."
                    : c.includes("user-disabled") ? "This account has been disabled. Contact the admin."
                    : "Invalid email / Employee ID or password.";
                $("loginMessage").textContent = msg;
                toast(msg, "err");
                $("loginBtn").disabled = false;
            }
        });
    </script>
</body>
</html>
